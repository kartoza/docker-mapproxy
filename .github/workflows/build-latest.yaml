name: build-latest
on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - 'build_data/**'
      - '.github/workflows/**'
  push:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - 'build_data/**'
      - '.github/workflows/**'

jobs:

  determine_run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pythonMajorVersion:
          - 3
        pythonMinorVersion:
          - 13
    outputs:
      skip_release: ${{ steps.skip_check.outputs.skip_release }}
      python_major_version: ${{ steps.python_version.outputs.major }}
      python_minor_version: ${{ steps.python_version.outputs.minor }}
    steps:
      - name: Resolve configured Python version
        id: python_version
        run: |
          echo "major=${{ matrix.pythonMajorVersion }}" >> "$GITHUB_OUTPUT"
          echo "minor=${{ matrix.pythonMinorVersion }}" >> "$GITHUB_OUTPUT"

      - name: Determine skip-release
        id: skip_check
        run: |
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            echo "skip_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ "${{ github.event.pull_request.title }}" == *"[skip-release]"* ]]; then
            echo "skip_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "skip_release=false" >> $GITHUB_OUTPUT

  resolve-versions:
    if: needs.determine_run.outputs.skip_release == 'false'
    needs: [ determine_run ]
    runs-on: ubuntu-latest
    outputs:
      python_version: ${{ steps.versions.outputs.python_version }}
      python_image_sha: ${{ steps.versions.outputs.python_image_sha }}
      mapproxy_version: ${{ steps.versions.outputs.mapproxy_version }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Resolve latest build versions
        id: versions
        env:
          PYTHON_MAJOR_VERSION: ${{ needs.determine_run.outputs.python_major_version }}
          PYTHON_MINOR_VERSION: ${{ needs.determine_run.outputs.python_minor_version }}
        run: bash .github/scripts/resolve-build-versions.sh

  run-scenario-tests:
    if: needs.determine_run.outputs.skip_release == 'false'
    runs-on: ubuntu-latest
    needs: [ determine_run, resolve-versions ]
    strategy:
      matrix:
        scenario:
          - s3
          - proxy
          - multi_proxy
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for testing
        id: docker_build_testing_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          pull: true
          push: false
          load: true
          tags: kartoza/mapproxy
          build-args: |
            IMAGE_VERSION=${{ needs.resolve-versions.outputs.python_version }}
            PYTHON_IMAGE_SHA=${{ needs.resolve-versions.outputs.python_image_sha }}
            MAPPROXY_VERSION===${{ needs.resolve-versions.outputs.mapproxy_version }}
          cache-from: |
           type=gha,scope=test
           type=gha,scope=prod
          cache-to: type=gha,scope=test

      - name: Run scenario test ${{ matrix.scenario }}
        working-directory: scenario_tests/${{ matrix.scenario }}
        env:
          COMPOSE_INTERACTIVE_NO_CLI: 1
          PRINT_TEST_LOGS: 1
        run: |
          bash ./test.sh

  push-internal-pr-images:
    if: |
      github.event_name == 'pull_request' && 
      github.event.pull_request.base.repo.url == github.event.pull_request.head.repo.url && 
      needs.determine_run.outputs.skip_release == 'false'
    runs-on: ubuntu-latest
    needs: [ run-scenario-tests, determine_run, resolve-versions ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_REPO}}/mapproxy
          tags: |
            type=semver,pattern=\d.\d.\d
            type=ref,event=branch
            type=ref,event=pr
