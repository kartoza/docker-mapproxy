
services:
  map:
    image: 3liz/qgis-map-server:3.44
    environment:
      - QGSRV_SERVER_WORKERS=6
      - QGSRV_LOGGING_LEVEL=DEBUG
      - QGSRV_CACHE_ROOTDIR=/web
      - QGSRV_CACHE_SIZE=100
      - QGSRV_SERVER_TIMEOUT=300
    volumes:
      - ./data:/web:rw
  mapproxy:
    image: kartoza/mapproxy
    environment:
      - PRODUCTION=true
      - PROCESSES=4
      - CHEAPER=2
      - THREADS=10
      - MAPPROXY_USER_ID=${MAPPROXY_USER_ID:-1000}
      - MAPPROXY_GROUP_ID=1000
      - MULTI_MAPPROXY=true
      - MULTI_MAPPROXY_BASE_CACHE_DIR=/cache_dir
      - ALLOW_LISTING=True
      - LOGGING=true
    volumes:
      - ./mapproxy_configuration:/multi_mapproxy
      - ./cache_dir:/cache_dir
    depends_on:
      - map
    ports:
      - "8080"


